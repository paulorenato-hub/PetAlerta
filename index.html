<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta pet - cidadania aplicada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "mural-container">
        <h2>Pet Alerta</h2>
        <p>Pronta ajuda para encontrar seu pet!</p>

        <form class ="formulario" id="formPet">
        <input type="text" id="nomePet" placeholder="Qual o nome do seu pet?" required>
        <input type="text" id="infoPet" placeholder="Onde ele foi visto pela última vez?" required>
        <input type="file" id="fotoPet" accept="image/*" required>

            <button type="submit">Publicar Alerta</button>
        </form>
       <h3>Mural de Alertas:</h3>
       <ul id="listaDePets"></ul>
       <p id= "mensagemVazia">Sem alertas ativos no momento</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
